<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            margin-bottom: 10px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        .user-info p {
            margin: 5px 0;
        }

        .post {
            background: #f9f9f9;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #007bff;
            border-radius: 4px;
        }

        .post h3 {
            margin-bottom: 5px;
            color: #007bff;
        }

        .comment {
            background: #eef6ff;
            padding: 8px;
            margin: 8px 0 8px 20px;
            border-left: 3px solid #28a745;
            border-radius: 4px;
        }

        .comment strong {
            color: #28a745;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 40px;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Callback Example - Users, Posts & Comments</h1>

    <div class="container">
        <div id="loading" class="loading">Loading data...</div>
        <div id="content" style="display: none;">
            <div class="section" id="user-section">
                <h2>User</h2>
                <div class="user-info" id="user-info"></div>
            </div>

            <div class="section" id="posts-section">
                <h2>Posts</h2>
                <div id="posts-list"></div>
            </div>

            <div class="section" id="comments-section">
                <h2>Comments (from first post)</h2>
                <div id="comments-list"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="java_callback.js"></script>
</body>
</html>
