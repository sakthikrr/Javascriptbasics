<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            margin-bottom: 10px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        .user-info p {
            margin: 5px 0;
        }

        .post {
            background: #f9f9f9;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #007bff;
            border-radius: 4px;
        }

        .post h3 {
            margin-bottom: 5px;
            color: #007bff;
        }

        .comment {
            background: #eef6ff;
            padding: 8px;
            margin: 8px 0 8px 20px;
            border-left: 3px solid #28a745;
            border-radius: 4px;
        }

        .comment strong {
            color: #28a745;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 40px;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Callback Example - Users, Posts & Comments</h1>

    <div class="container">
        <div id="loading" class="loading">Loading data...</div>
        <div id="content" style="display: none;">
            <div class="section" id="user-section">
                <h2>User</h2>
                <div class="user-info" id="user-info"></div>
            </div>

            <div class="section" id="posts-section">
                <h2>Posts</h2>
                <div id="posts-list"></div>
            </div>

            <div class="section" id="comments-section">
                <h2>Comments (from first post)</h2>
                <div id="comments-list"></div>
            </div>
        </div>
    </div>

    <script>
        function getUser(callback) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://jsonplaceholder.typicode.com/users/1");

            xhr.onload = function () {
                if (xhr.status === 200) {
                    callback(null, JSON.parse(xhr.responseText));
                } else {
                    callback("Error fetching user");
                }
            };

            xhr.send();
        }

        function getPosts(userId, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://jsonplaceholder.typicode.com/posts?userId=" + userId);

            xhr.onload = function () {
                if (xhr.status === 200) {
                    callback(null, JSON.parse(xhr.responseText));
                } else {
                    callback("Error fetching posts");
                }
            };

            xhr.send();
        }

        function getComments(postId, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://jsonplaceholder.typicode.com/comments?postId=" + postId);

            xhr.onload = function () {
                if (xhr.status === 200) {
                    callback(null, JSON.parse(xhr.responseText));
                } else {
                    callback("Error fetching comments");
                }
            };

            xhr.send();
        }

        // Callback Hell - fetch user, then posts, then comments
        getUser(function (err, user) {
            if (err) {
                document.getElementById("loading").innerHTML = '<span class="error">' + err + '</span>';
                return;
            }

            // Display user info
            var userInfo = document.getElementById("user-info");
            userInfo.innerHTML =
                "<p><strong>Name:</strong> " + user.name + "</p>" +
                "<p><strong>Username:</strong> " + user.username + "</p>" +
                "<p><strong>Email:</strong> " + user.email + "</p>" +
                "<p><strong>Phone:</strong> " + user.phone + "</p>" +
                "<p><strong>Website:</strong> " + user.website + "</p>" +
                "<p><strong>Company:</strong> " + user.company.name + "</p>";

            getPosts(user.id, function (err, posts) {
                if (err) {
                    document.getElementById("loading").innerHTML = '<span class="error">' + err + '</span>';
                    return;
                }

                // Display posts
                var postsList = document.getElementById("posts-list");
                for (var i = 0; i < posts.length; i++) {
                    var postDiv = document.createElement("div");
                    postDiv.className = "post";
                    postDiv.innerHTML =
                        "<h3>" + (i + 1) + ". " + posts[i].title + "</h3>" +
                        "<p>" + posts[i].body + "</p>";
                    postsList.appendChild(postDiv);
                }

                getComments(posts[0].id, function (err, comments) {
                    if (err) {
                        document.getElementById("loading").innerHTML = '<span class="error">' + err + '</span>';
                        return;
                    }

                    // Display comments
                    var commentsList = document.getElementById("comments-list");
                    for (var j = 0; j < comments.length; j++) {
                        var commentDiv = document.createElement("div");
                        commentDiv.className = "comment";
                        commentDiv.innerHTML =
                            "<strong>" + comments[j].name + "</strong>" +
                            "<p>" + comments[j].body + "</p>" +
                            "<small>By: " + comments[j].email + "</small>";
                        commentsList.appendChild(commentDiv);
                    }

                    // Hide loading, show content
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("content").style.display = "block";
                });
            });
        });
    </script>
</body>
</html>
